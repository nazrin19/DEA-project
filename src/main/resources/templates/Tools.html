<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#tools-content})}">
<head>
    <title>LankaTools - Equipment Catalog</title>
</head>
<body>
<div id="tools-content" class="container py-5">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
        <div>
            <h1 class="h3 fw-black text-dark mb-1">Available Equipment Catalog</h1>
            <p class="text-muted small mb-0">Premium industrial and local tools available for dynamic immediate booking slots.</p>
        </div>
        <a th:href="@{/tools/add}" class="btn text-white fw-semibold rounded-3 px-4 py-2 d-inline-flex align-items-center gap-2" style="background-color:#0c3966;">
            <i class="fa-solid fa-plus-circle" style="font-size: 0.75rem;"></i> Register New Equipment
        </a>
    </div>

    <div class="row g-4">
        <div class="col-12 col-sm-6 col-lg-4" th:each="tool : ${tools}">
            <div class="card h-100 border border-light-subtle rounded-4 shadow-sm tool-card transition-all">
                <div class="d-flex align-items-center justify-content-center bg-light-subtle border-bottom" style="height: 12rem;">
                    <img th:if="${tool.imageUrl != null}"
                         th:src="@{${tool.imageUrl}}"
                         onerror="this.onerror=null; this.src='/images/default-tool.png';"
                         class="p-3"
                         style="max-width: 100%; max-height: 100%; object-fit: contain;"
                         alt="Tool Image">
                    <div th:unless="${tool.imageUrl != null}" class="text-center p-3">
                        <i class="fa-solid fa-screwdriver-wrench fs-3 text-muted d-block mb-1"></i>
                        <span class="small text-muted fw-medium">No Image Found</span>
                    </div>
                </div>

                <div class="card-body d-flex flex-column">
                    <span class="small fw-bold text-uppercase rounded-pill px-3 py-1 mb-2 align-self-start"
                          style="color:#0c3966; background-color:#eef3f8; letter-spacing:0.5px; font-size: 0.7rem;"
                          th:text="${tool.category}">Category</span>

                    <h5 class="fw-bold text-dark mb-1" th:text="${tool.name}">Tool Name</h5>
                    <p class="small text-muted mb-3" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"
                       th:text="${tool.description}">Description text...</p>

                    <div class="mt-auto pt-3 border-top">
                        <p class="fw-semibold text-dark mb-3" th:text="'Rs. ' + ${tool.dailyRate} + '/Day'">Rs. 0.00/Day</p>
                        <a th:href="@{/tools/detail/{id}(id=${tool.id})}"
                           class="btn w-100 fw-semibold rounded-3 text-uppercase small py-2 tool-detail-btn"
                           style="border:1px solid #0c3966; color:#0c3966;">
                            View Asset Spec
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(tools)}" class="card border border-dashed border-light-subtle rounded-4 p-5 text-center text-muted">
        <h5 class="fw-semibold text-dark mb-2">No Tools Found</h5>
        <p class="mb-0">No tools are available in the catalog.</p>
    </div>
</div>

<style>
    .tool-detail-btn:hover {
        background-color: #0c3966;
        color: #ffffff !important;
    }
</style>

</body>
</html>
