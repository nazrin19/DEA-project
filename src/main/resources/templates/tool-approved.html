<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Tool Approved</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background-color: #ffffff; }
        .header { background-color: #28a745; color: white; padding: 15px; text-align: center; border-radius: 8px 0 0; font-size: 22px; }
        .content { padding: 20px; }
        .footer { text-align: center; font-size: 12px; color: #777; margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        Your Tool Has Been Approved!
    </div>
    <div class="content">
        <p>Dear <strong th:text="${ownerName}">User</strong>,</p>
        <p>Good news! Your tool <strong th:text="${toolName}">[Tool Name]</strong> has been successfully reviewed and approved by our administrator.</p>
        <p>It is now officially live and available for rent on <strong>LankaTools</strong>.</p>
        <p>Thank you for listing your equipment with us!</p>
    </div>
    <div class="footer">
        Best Regards,<br>
        <strong>LankaTools Admin Team</strong>
    </div>
</div>
</body>
</html>
