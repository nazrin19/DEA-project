<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Lankatools — Home</title>
</head>
<body>
<main class="container py-5">
    <div class="row align-items-center mb-4">
        <div class="col-lg-8">
            <h1 class="display-6 fw-bold">Book reliable tools with ease</h1>
            <p class="text-muted">Browse approved tools, choose your dates, and manage your bookings from one dashboard.</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="tool : ${tools}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${tool.name}">Tool name</h5>
                    <p class="text-muted small mb-2" th:text="${tool.category}">Category</p>
                    <p class="card-text" th:text="${tool.description}">Description</p>
                    <div class="mt-auto">
                        <p class="fw-bold mb-3">Rs. <span th:text="${#numbers.formatDecimal(tool.dailyRate, 1, 2)}">0.00</span> / day</p>
                        <a class="btn btn-outline-primary" th:href="@{/tools/{id}(id=${tool.id})}">View details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
