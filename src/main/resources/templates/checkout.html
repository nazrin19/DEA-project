<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#booking-confirm})}">
<head>
    <title>Confirm Booking - LankaTools</title>
</head>
<body>

<div id="booking-confirm" class="container py-5">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <div class="mx-auto" style="max-width: 640px;">

        <div th:if="${error}" class="alert alert-danger rounded-4 shadow-sm mb-4 border-0 p-3 text-danger fw-semibold" style="background-color: #fff1f2; border: 1px solid #ffe4e6 !important;">
            <i class="fa-solid fa-triangle-exclamation me-2"></i> <span th:text="${error}">An error occurred.</span>
        </div>

        <div th:if="${success}" class="alert alert-success rounded-4 shadow-sm mb-4 border-0 p-3 text-success fw-semibold" style="background-color: #f0fdf4; border: 1px solid #dcfce7 !important;">
            <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${success}">Booking submitted successfully!</span>
        </div>

        <div class="card border border-light-subtle rounded-4 shadow-sm p-4 p-sm-5 bg-white">

            <h1 class="h3 fw-black text-dark mb-4">Confirm Rental Details</h1>

            <div class="d-flex align-items-center gap-3 p-3 rounded-4 mb-4" style="background-color:#f8fafc; border:1px solid #e2e8f0;">
                <img th:src="@{${tool.imageUrl}}" onerror="this.onerror=null; this.src='/uploads/default-placeholder.png';"
                     class="bg-white rounded-3 border p-1" style="width: 4rem; height: 4rem; object-fit: contain;">
                <div>
                    <h3 class="fw-bold text-dark fs-5 mb-0" th:text="${tool.name}">Equipment Name</h3>
                    <p class="small text-muted mb-0" th:text="${tool.category}">Category</p>
                </div>
            </div>

            <form th:action="@{/bookings}" method="post">
                <input type="hidden" name="toolId" th:value="${tool.id}" />

                <div class="row g-3 mb-4">
                    <div class="col-12 col-sm-6">
                        <label class="small fw-bold text-uppercase text-muted mb-1 d-block" style="letter-spacing:0.5px; font-size:0.7rem;">Pick-up Date</label>
                        <input type="date" id="startDate" name="startDate" required
                               class="form-control rounded-3">
                    </div>
                    <div class="col-12 col-sm-6">
                        <label class="small fw-bold text-uppercase text-muted mb-1 d-block" style="letter-spacing:0.5px; font-size:0.7rem;">Return Date</label>
                        <input type="date" id="endDate" name="endDate" required
                               class="form-control rounded-3">
                    </div>
                </div>

                <div class="rounded-4 p-4 mb-4" style="background-color:#eef3f8; border:1px solid #dde7f0;">
                    <div class="d-flex justify-content-between small mb-2" style="color:#0c3966;">
                        <span>Daily Rate:</span>
                        <span class="fw-bold">Rs. <span id="dailyRate" th:text="${tool.dailyRate}">0.00</span></span>
                    </div>
                    <div class="d-flex justify-content-between small mb-2" style="color:#0c3966;">
                        <span>Total Duration:</span>
                        <span class="fw-bold"><span id="daysCount">0</span> Days</span>
                    </div>
                    <div class="d-flex justify-content-between fw-black pt-3 border-top" style="color:#0c3966; font-size: 1.05rem;">
                        <span>Estimated Cost:</span>
                        <span>Rs. <span id="totalCost">0.00</span></span>
                    </div>
                </div>

                <button type="submit" class="btn text-white fw-bold rounded-3 py-3 w-100" style="background-color:#0c3966;">
                    Finalize &amp; Place Booking Order
                </button>
            </form>
        </div>
    </div>

    <script>
        (function() {
            function initCalculator() {
                const startInput = document.getElementById('startDate');
                const endInput = document.getElementById('endDate');
                const daysDisplay = document.getElementById('daysCount');
                const costDisplay = document.getElementById('totalCost');

                if (!startInput || !endInput) return false;

                function calculateCost() {
                    if (startInput.value && endInput.value) {
                        const dailyRateElement = document.getElementById('dailyRate');
                        if (!dailyRateElement) return;

                        const dailyRate = parseFloat(dailyRateElement.innerText.replace(/[^0-9.]/g, '')) || 0;

                        // Zero out timezone shifts by using manual split values
                        const startParts = startInput.value.split('-');
                        const endParts = endInput.value.split('-');

                        const start = new Date(startParts[0], startParts[1] - 1, startParts[2]);
                        const end = new Date(endParts[0], endParts[1] - 1, endParts[2]);

                        const diffTime = end.getTime() - start.getTime();
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

                        if (diffDays > 0) {
                            daysDisplay.innerText = diffDays;
                            costDisplay.innerText = (diffDays * dailyRate).toFixed(2);
                        } else {
                            daysDisplay.innerText = "0";
                            costDisplay.innerText = "0.00";
                        }
                    }
                }

                startInput.addEventListener('input', calculateCost);
                endInput.addEventListener('input', calculateCost);
                startInput.addEventListener('change', calculateCost);
                endInput.addEventListener('change', calculateCost);
                return true;
            }

            // Execute instantly if DOM layout is ready, otherwise wait for loading phase
            if (!initCalculator()) {
                document.addEventListener('DOMContentLoaded', initCalculator);
            }
        })();
    </script>
</div> </body>
</html>
