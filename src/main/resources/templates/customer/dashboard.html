<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard - Lankatools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800">

<div class="flex min-h-screen">
    <aside class="w-64 bg-indigo-900 text-indigo-200 flex flex-col shadow-xl">
        <div class="p-5 border-b border-indigo-800">
            <h1 class="text-xl font-bold tracking-wider text-white">Lankatools</h1>
            <span class="text-xs text-indigo-300 font-semibold uppercase tracking-widest block mt-1">Customer Portal</span>
        </div>

        <nav class="flex-1 p-4 space-y-2 text-sm">
            <a href="/customer/dashboard" class="flex items-center space-x-3 bg-indigo-800 text-white p-3 rounded-lg font-medium transition">
                <i class="fa-solid fa-house"></i>
                <span>My Dashboard</span>
            </a>
            <a href="/tools" class="flex items-center space-x-3 text-indigo-300 hover:bg-indigo-800 hover:text-white p-3 rounded-lg transition">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Browse Tools</span>
            </a>
            <a href="/customer/bookings" class="flex items-center space-x-3 text-indigo-300 hover:bg-indigo-800 hover:text-white p-3 rounded-lg transition">
                <i class="fa-solid fa-calendar-check"></i>
                <span>My Bookings</span>
            </a>
        </nav>

        <div class="p-4 border-t border-indigo-800">
            <form th:action="@{/logout}" method="POST" class="m-0">
                <button type="submit" class="w-full flex items-center justify-center space-x-2 bg-indigo-950 hover:bg-red-800 text-indigo-200 hover:text-white p-2.5 rounded-lg transition">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                    <span class="text-xs font-semibold">Logout</span>
                </button>
            </form>
        </div>
    </aside>

    <main class="flex-1 p-8">
        <header class="flex justify-between items-center pb-6 border-b border-slate-200 mb-8">
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Welcome back!</h2>
                <p class="text-sm text-slate-500">Find the gear and tools you need for your next project.</p>
            </div>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/60 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Active Rentals</p>
                    <h3 class="text-3xl font-extrabold text-slate-900">1</h3>
                </div>
                <div class="bg-indigo-50 text-indigo-600 p-4 rounded-xl">
                    <i class="fa-solid fa-clock text-2xl"></i>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/60 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Orders Placed</p>
                    <h3 class="text-3xl font-extrabold text-slate-900">4</h3>
                </div>
                <div class="bg-emerald-50 text-emerald-600 p-4 rounded-xl">
                    <i class="fa-solid fa-circle-check text-2xl"></i>
                </div>
            </div>
        </section>

        <section class="bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden">
            <div class="p-5 border-b border-slate-100 bg-slate-50/50">
                <h4 class="font-bold text-slate-900 text-sm tracking-wide">Your Recent Orders</h4>
            </div>
            <div class="p-6 text-center text-slate-500 text-sm">
                <p>No ongoing tool reservations found. Ready to start? <a href="/tools" class="text-indigo-600 font-semibold hover:underline">Explore the tool collection</a></p>
            </div>
        </section>
    </main>
</div>

</body>
</html>
