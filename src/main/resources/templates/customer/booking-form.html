<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#book-rental-container})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Rental - LankaTools</title>
</head>
<body>


<div id="book-rental-container" class="container my-5" style="max-width: 600px;">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Back Navigation & Title Header Row -->
    <div class="mb-4">
        <a href="/" class="text-decoration-none small fw-semibold link-primary d-inline-flex align-items-center gap-1 mb-2" style="color: #0c3966;">
            <i class="fa-solid fa-arrow-left" style="font-size: 0.75rem;"></i> Return to Marketplace
        </a>
        <h1 class="h4 fw-bold tracking-tight mb-1 text-dark" style="font-weight: 900;">Confirm Rental Duration</h1>
        <p class="text-muted small mb-0">Specify your operational dates to complete checkout.</p>
    </div>

    <!-- Selection Card Summary Box Unit -->
    <div class="card border border-light-subtle p-4 rounded-4 bg-white shadow-sm mb-4">
        <div class="d-flex align-items-start gap-3">
            <img th:src="${tool.imageUrl != null ? tool.imageUrl : '/uploads/default-placeholder.png'}"
                 class="rounded-3 border border-light shadow-sm object-fit-cover"
                 style="width: 4rem; height: 4rem; min-width: 4rem; background-color: #f8fafc;"
                 onerror="this.src='/uploads/default-placeholder.png'">
            <div>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle font-monospace text-uppercase px-2 py-1 mb-1"
                      style="font-size: 0.65rem; font-weight: 700;" th:text="${tool.category}">Category</span>
                <h2 class="h5 fw-bold text-dark mb-1" th:text="${tool.name}">Equipment Name</h2>
                <p class="text-success font-monospace fw-bold mb-0 small">
                    Rs. <span class="fs-5" th:text="${tool.dailyRate}">0.00</span> / day
                </p>
            </div>
        </div>
    </div>

    <!-- The Booking Submission Form Element Panel Box -->
    <div class="card border border-light-subtle p-4 rounded-4 bg-white shadow-sm">
        <form th:action="@{/customer/bookings/create}" method="POST" class="m-0 p-0">
            <!-- Hidden context reference mapping parameter -->
            <input type="hidden" name="toolId" th:value="${tool.id}"/>

            <!-- Start Date Input Entry Container -->
            <div class="mb-3">
                <label class="form-label text-uppercase font-monospace text-secondary fw-bold" style="font-size: 0.7rem; letter-spacing: 0.5px;">Start Date</label>
                <div class="position-relative">
                    <input type="date" name="startDate" required
                           class="form-control rounded-3 py-2 bg-light border-light-subtle small ps-5" style="font-size: 0.85rem;">
                    <i class="fa-regular fa-calendar-plus position-absolute text-secondary opacity-50 start-0 top-50 translate-middle-y ms-3" style="font-size: 0.9rem;"></i>
                </div>
            </div>

            <!-- End Date Input Entry Container -->
            <div class="mb-4">
                <label class="form-label text-uppercase font-monospace text-secondary fw-bold" style="font-size: 0.7rem; letter-spacing: 0.5px;">End Date</label>
                <div class="position-relative">
                    <input type="date" name="endDate" required
                           class="form-control rounded-3 py-2 bg-light border-light-subtle small ps-5" style="font-size: 0.85rem;">
                    <i class="fa-regular fa-calendar-minus position-absolute text-secondary opacity-50 start-0 top-50 translate-middle-y ms-3" style="font-size: 0.9rem;"></i>
                </div>
            </div>

            <!-- Trust Badges Footer Metadata block -->
            <div class="pt-3 border-top border-light mb-4 d-flex align-items-center justify-content-between font-monospace text-muted" style="font-size: 0.7rem;">
                <span><i class="fa-solid fa-shield-halved me-1 opacity-75"></i> Payment processed securely</span>
                <span class="fw-semibold text-dark">LankaTools Guarantee 🛡️</span>
            </div>

            <!-- Form Submitting Action Trigger Element Button -->
            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold text-uppercase tracking-wide rounded-3 d-flex align-items-center justify-content-center gap-2 border-0"
                    style="background-color: #0c3966; font-size: 0.8rem; letter-spacing: 0.5px;">
                <i class="fa-solid fa-credit-card"></i>
                <span>Confirm & Pay</span>
            </button>
        </form>
    </div>
</div>

</body>
</html>
