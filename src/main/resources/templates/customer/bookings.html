<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#bookings-container})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Rental Bookings - LankaTools</title>
</head>
<body>


<div id="bookings-container" class="container py-5" style="max-width: 750px;">


    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <h1 class="h4 fw-bold text-center text-dark mb-4" style="font-weight: 800;">Your Rental Receipts & History</h1>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(bookings)}" class="card border border-light-subtle p-5 rounded-4 text-center bg-white shadow-sm">
        <div class="rounded-circle d-flex align-items-center justify-content-center text-secondary bg-light mx-auto mb-3" style="width: 3rem; height: 3rem;">
            <i class="fa-solid fa-receipt fs-5"></i>
        </div>
        <h3 class="h6 fw-bold text-dark mb-1">No transactions found</h3>
        <p class="text-muted small mb-3">You haven't ordered or reserved any hardware gear tools yet.</p>
        <a th:href="@{/}" class="btn text-white fw-bold btn-sm rounded-3 px-4 py-2 border-0" style="background-color: #0c3966; font-size: 0.75rem;">
            Explore Marketplace
        </a>
    </div>

    <!-- Booking List Grid -->
    <div th:if="${not #lists.isEmpty(bookings)}" class="d-flex flex-column gap-3">
        <div th:each="booking : ${bookings}" class="card border border-light-subtle p-3 rounded-4 bg-white shadow-sm d-flex flex-row align-items-center justify-content-between">

            <!-- Left Block: Icon & Detail Descriptions -->
            <div class="d-flex align-items-center gap-3">
                <div class="rounded-3 d-flex align-items-center justify-content-center" style="width: 3rem; height: 3rem; background-color: #e6f0fa; border: 1px solid #cbdcf2; min-width: 3rem;">
                    <i class="fa-solid fa-screwdriver-wrench fs-5" style="color: #0c3966;"></i>
                </div>
                <div>
                    <h3 class="h6 fw-bold text-dark mb-1" th:text="${booking.tool != null ? booking.tool.name : 'Unknown Tool'}">Tool Name</h3>
                    <p class="text-muted font-monospace small mb-0" style="font-size: 0.75rem;">
                        <span th:text="${booking.startDate}">2026-06-29</span> to <span th:text="${booking.endDate}">2026-07-05</span>
                    </p>
                </div>
            </div>

            <!-- Right Block: Price Tracking & Status Badging elements -->
            <div class="text-end">
                <span class="fs-6 fw-bold text-dark d-block mb-1" th:text="'LKR ' + ${booking.totalCost}">LKR 0.00</span>
                <span class="badge border font-monospace text-uppercase px-2.5 py-1.5" style="font-size: 0.65rem; font-weight: 700;"
                      th:classappend="${#strings.toString(booking.status) == 'CONFIRMED' || #strings.toString(booking.status) == 'RETURNED' ? 'bg-success-subtle text-success border-success-subtle' :
                                       #strings.toString(booking.status) == 'PENDING' ? 'bg-warning-subtle text-warning-emphasis border-warning-subtle' :
                                       'bg-light text-secondary border-light-subtle'}"
                      th:text="${booking.status}">
                    PENDING
                </span>
            </div>

        </div>
    </div>
</div>

</body>
</html>
