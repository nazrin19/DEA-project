<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Rental Bookings - LankaTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

<nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a th:href="@{/}" class="text-xl font-black text-blue-600 tracking-tight">🛠️ LankaTools</a>
            </div>
            <div class="flex items-center gap-4">
                <a th:href="@{/customer/dashboard}" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition-colors">Dashboard</a>
                <a th:href="@{/logout}" class="text-sm font-semibold text-rose-600 hover:text-rose-700 transition-colors">Logout</a>
            </div>
        </div>
    </div>
</nav>

<div class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-black text-slate-900 mb-6">Your Rental Receipts & History</h1>

    <div th:if="${#lists.isEmpty(bookings)}" class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm text-center">
        <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
            <i class="fa-solid fa-receipt text-lg"></i>
        </div>
        <h3 class="text-base font-bold text-slate-800">No transactions found</h3>
        <p class="text-slate-400 text-xs mt-1">You haven't ordered or reserved any hardware gear tools yet.</p>
        <a th:href="@{/}" class="mt-4 inline-block bg-blue-600 text-white font-bold text-xs px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
            Explore Marketplace
        </a>
    </div>

    <div th:if="${not #lists.isEmpty(bookings)}" class="space-y-4">
        <div th:each="booking : ${bookings}" class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center text-lg">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-900" th:text="${booking.tool != null ? booking.tool.name : 'Unknown Tool'}">Tool Name</h3>
                    <p class="text-xs text-slate-400 mt-0.5">
                        <span th:text="${booking.startDate}">2026-06-29</span> to <span th:text="${booking.endDate}">2026-07-05</span>
                    </p>
                </div>
            </div>

            <div class="text-right">
                <span class="text-sm font-black text-slate-900 block" th:text="'LKR ' + ${booking.totalCost}">LKR 0.00</span>
                <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider mt-1 border"
                      th:classappend="${booking.status == 'CONFIRMED' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                                       booking.status == 'PENDING' ? 'bg-amber-50 text-amber-700 border-amber-200' :
                                       'bg-slate-100 text-slate-600 border-slate-200'}"
                      th:text="${booking.status}">
                    PENDING
                </span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
