<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Create Booking</title>
</head>
<body>
<main class="container mt-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <h1>Create Booking</h1>
            <p class="text-muted">Select a tool, choose dates, and submit your reservation.</p>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/bookings/create}" method="post" class="mt-4">
                <div class="mb-3">
                    <label for="toolId" class="form-label">Tool</label>
                    <select class="form-select" id="toolId" name="toolId" required>
                        <option value="" disabled selected>Select a tool</option>
                        <option th:each="tool : ${tools}"
                                th:value="${tool.id}"
                                th:text="${tool.name + ' — ' + tool.category + ' ($' + tool.dailyRate + '/day)'}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="customerName" class="form-label">Customer Name</label>
                    <input type="text" class="form-control" id="customerName" name="customerName" required>
                </div>

                <div class="mb-3">
                    <label for="customerEmail" class="form-label">Customer Email</label>
                    <input type="email" class="form-control" id="customerEmail" name="customerEmail" required>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="startDate" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="startDate" name="startDate" required>
                    </div>
                    <div class="col-md-6">
                        <label for="endDate" class="form-label">End Date</label>
                        <input type="date" class="form-control" id="endDate" name="endDate" required>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-between">
                    <a th:href="@{/bookings}" class="btn btn-outline-secondary">Back to Bookings</a>
                    <button type="submit" class="btn btn-primary">Submit Booking</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
