<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List New Equipment - LankaTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-between">

<div class="max-w-xl mx-auto w-full px-4 py-10">
    <div class="mb-6">
        <a th:href="@{/owner/dashboard}" class="text-sm font-semibold text-blue-600 hover:underline flex items-center gap-1 mb-2">
            <i class="fa-solid fa-arrow-left text-xs"></i> Back to Dashboard
        </a>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">List New Hardware Gear</h1>
        <p class="text-slate-500 text-sm mt-0.5">Submitted assets default to pending state verification status.</p>
    </div>

    <div id="statusAlert" class="hidden p-4 mb-6 text-sm font-semibold rounded-lg transition-all"></div>

    <form id="uploadToolForm" enctype="multipart/form-data" class="bg-white p-6 rounded-xl border border-slate-200 shadow-md space-y-5">
        <div>
            <label class="block text-xs uppercase font-bold tracking-wider text-slate-500 mb-2">Equipment Name</label>
            <input type="text" name="name" required placeholder="e.g., Heavy Duty Demolition Jackhammer"
                   class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50/50">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs uppercase font-bold tracking-wider text-slate-500 mb-2">Equipment Category</label>
                <select name="category" required
                        class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50/50">
                    <option value="Power Tools">Power Tools</option>
                    <option value="Access Equipment">Access Equipment</option>
                    <option value="Concrete Machinery">Concrete Machinery</option>
                    <option value="Gardening & Landscaping">Gardening & Landscaping</option>
                </select>
            </div>
            <div>
                <label class="block text-xs uppercase font-bold tracking-wider text-slate-500 mb-2">Daily Rental Rate (Rs.)</label>
                <input type="number" step="0.01" name="dailyRate" required placeholder="3500.00"
                       class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50/50">
            </div>
        </div>

        <div>
            <label class="block text-xs uppercase font-bold tracking-wider text-slate-500 mb-2">Detailed Condition/Description</label>
            <textarea name="description" rows="4" required placeholder="Provide breakdown context info regarding engine power outputs, attachments..."
                      class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50/50"></textarea>
        </div>

        <div>
            <label class="block text-xs uppercase font-bold tracking-wider text-slate-500 mb-2">Hardware Presentation Image Attachment</label>
            <div class="border-2 border-dashed border-slate-200 rounded-xl p-4 text-center bg-slate-50/30 hover:bg-slate-50 transition-all relative">
                <input type="file" name="file" accept="image/png, image/jpeg, image/jpg" class="absolute inset-0 opacity-0 cursor-pointer">
                <div class="space-y-1">
                    <i class="fa-solid fa-cloud-arrow-up text-slate-400 text-xl block mb-1"></i>
                    <span class="text-sm font-semibold text-slate-600 block">Choose file attachment</span>
                    <span class="text-xs text-slate-400 block">JPEG, JPG, PNG up to 2MB asset capacity limits</span>
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-sm transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer">
            <span>Deploy Registration Listing</span>
        </button>
    </form>
</div>

<script>
    document.getElementById("uploadToolForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const form = e.target;
        const formData = new FormData(form);
        const alertBox = document.getElementById("statusAlert");
        const submitBtn = document.getElementById("submitBtn");

        submitBtn.disabled = true;
        submitBtn.innerText = "Processing submission streams...";

        try {
            const response = await fetch('/api/tools/save', {
                method: 'POST',
                body: formData
            });

            if (response.status === 201 || response.ok) {
                alertBox.className = "p-4 mb-6 text-sm font-semibold rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-200";
                alertBox.innerText = "✨ Success! Your tool listing has been uploaded and queued for admin moderation.";
                alertBox.classList.remove("hidden");
                form.reset();
            } else {
                const errorText = await response.text();
                throw new Error(errorText || "An unexpected error occurred.");
            }

        } catch (err) {
            alertBox.className = "p-4 mb-6 text-sm font-semibold rounded-lg bg-rose-100 text-rose-800 border border-rose-200";
            alertBox.innerText = "❌ Upload Failed: " + err.message;
            alertBox.classList.remove("hidden");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Deploy Registration Listing";
        }
    });
</script>
</body>
</html>
