<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#owner-dashboard})}">
<head>
    <title>Owner Dashboard - LankaTools</title>
</head>
<body>

<div id="owner-dashboard" class="container py-5">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
        <div>
            <h1 class="h3 fw-black text-dark mb-1">Welcome Back, Partner!</h1>
            <p class="text-muted small mb-0">Track your gear performance and process active bookings.</p>
        </div>
        <a href="/owner/upload-tool" class="btn text-white fw-semibold rounded-3 px-4 py-2" style="background-color:#0c3966;">
            <i class="fa-solid fa-plus me-1"></i> Add New Tool
        </a>
    </div>

    <div class="row g-4">
        <div class="col-12 col-md-4">
            <div class="card border border-light-subtle p-4 rounded-4 shadow-sm h-100">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <h3 class="text-uppercase small fw-bold text-muted mb-0" style="letter-spacing:0.5px;">Active Inventory</h3>
                    <i class="fa-solid fa-screwdriver-wrench fs-5" style="color:#0c3966;"></i>
                </div>
                <p class="display-6 fw-bold text-dark mb-3" th:text="${toolsCount != null ? toolsCount : '0'}">0</p>
                <a href="/owner/my-tool" class="fw-semibold small text-decoration-none" style="color:#0c3966;">View your equipment →</a>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card border border-light-subtle p-4 rounded-4 shadow-sm h-100">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <h3 class="text-uppercase small fw-bold text-muted mb-0" style="letter-spacing:0.5px;">Rental Orders</h3>
                    <i class="fa-solid fa-calendar-check fs-5 text-success"></i>
                </div>
                <p class="display-6 fw-bold text-dark mb-3" th:text="${bookingsCount != null ? bookingsCount : '0'}">0</p>
                <a href="/owner/rental-requests" class="fw-semibold small text-success text-decoration-none">Review bookings →</a>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card border border-light-subtle p-4 rounded-4 shadow-sm h-100">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <h3 class="text-uppercase small fw-bold text-muted mb-0" style="letter-spacing:0.5px;">Estimated Revenue</h3>
                    <i class="fa-solid fa-wallet fs-5 text-warning"></i>
                </div>
                <p class="display-6 fw-bold text-dark mb-3">Rs. <span th:text="${totalEarnings != null ? totalEarnings : '0.00'}">0.00</span></p>
                <span class="fw-semibold small text-muted">Updated in real-time</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
