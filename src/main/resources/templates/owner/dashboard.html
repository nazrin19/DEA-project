<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - LankaTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800">

<nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a th:href="@{/}" class="text-xl font-black text-blue-600 tracking-tight hover:opacity-80 transition-all flex items-center">
                    🛠️ LankaTools
                    <span class="text-xs font-bold uppercase bg-blue-100 text-blue-700 px-2 py-0.5 rounded ml-1">Owner</span>
                </a>
            </div>
            <div class="flex items-center gap-4">
                <a th:href="@{/owner/upload-tool}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition-all">
                    <i class="fa-solid fa-plus mr-1"></i> Add New Tool
                </a>
                <form th:action="@{/logout}" method="post" class="m-0 inline">
                    <button type="submit" class="text-sm font-medium text-slate-600 hover:text-slate-900 border-0 bg-transparent cursor-pointer">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
        <h1 class="text-2xl font-black text-slate-900">Welcome Back, Partner!</h1>
        <p class="text-slate-500 text-sm mt-1">Track your gear performance and process active bookings.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Active Inventory</h3>
                <i class="fa-solid fa-screwdriver-wrench text-blue-500 text-lg"></i>
            </div>
            <p class="text-3xl font-black text-slate-900 mt-2" th:text="${toolsCount != null ? toolsCount : '0'}">0</p>
            <a href="/owner/my-tool" class="text-xs font-semibold text-blue-600 hover:underline block mt-4">View your equipment →</a>
        </div>

        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Rental Orders</h3>
                <i class="fa-solid fa-calendar-check text-emerald-500 text-lg"></i>
            </div>
            <p class="text-3xl font-black text-slate-900 mt-2" th:text="${bookingsCount != null ? bookingsCount : '0'}">0</p>
            <a href="/owner/rental-requests" class="text-xs font-semibold text-emerald-600 hover:underline block mt-4">Review bookings →</a>
        </div>

        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Estimated Revenue</h3>
                <i class="fa-solid fa-wallet text-amber-500 text-lg"></i>
            </div>
            <p class="text-3xl font-black text-slate-900 mt-2">Rs. <span th:text="${totalEarnings != null ? #numbers.formatDecimal(totalEarnings, 1, 2) : '0.00'}">0.00</span></p>
            <span class="text-xs font-medium text-slate-400 block mt-4">Updated in real-time</span>
        </div>
    </div>
</div>

</body>
</html>
