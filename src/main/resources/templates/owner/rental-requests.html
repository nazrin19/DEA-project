<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#rental-requests})}">
<head>
    <title>Rental Requests - LankaTools</title>
</head>
<body>

<div id="rental-requests" class="container py-5">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
        <div>
            <a href="/owner/dashboard" class="small fw-semibold text-decoration-none d-inline-flex align-items-center gap-1 mb-2" style="color:#0c3966;">
                <i class="fa-solid fa-arrow-left" style="font-size: 0.7rem;"></i> Back to Dashboard
            </a>
            <h1 class="h3 fw-black text-dark mb-0">Incoming Rental Bookings</h1>
        </div>
    </div>

    <div class="card border border-light-subtle rounded-4 shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr class="text-uppercase small fw-bold text-muted" style="background-color:#f1f5f9; letter-spacing:0.5px;">
                    <th class="p-3">Rented Equipment</th>
                    <th class="p-3">Client Contact</th>
                    <th class="p-3">Rental Duration</th>
                    <th class="p-3">Financial Total</th>
                    <th class="p-3 text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${bookings == null || bookings.empty}">
                    <td colspan="5" class="p-5 text-center text-muted fst-italic">
                        No active booking context profiles registered for your tools yet.
                    </td>
                </tr>
                <tr th:each="booking : ${bookings}">
                    <td class="p-3">
                        <span class="fw-bold text-dark d-block" th:text="${booking.tool != null ? booking.tool.name : 'Unknown Equipment'}">Demolition Jackhammer</span>
                        <span class="text-muted small d-block" th:text="${booking.tool != null ? booking.tool.category : 'General'}">Power Tools</span>
                    </td>
                    <td class="p-3">
                        <span class="fw-semibold text-dark d-block" th:text="${booking.customer != null ? booking.customer.name : 'Guest User'}">Customer Name</span>
                        <span class="text-muted small d-block" th:text="${booking.customer != null ? booking.customer.email : 'N/A'}">email@example.com</span>
                    </td>
                    <td class="p-3 text-muted">
                        <i class="fa-regular fa-calendar text-xs text-muted me-1"></i>
                        <span th:text="${booking.startDate}">2026-06-28</span> to <span th:text="${booking.endDate}">2026-06-30</span>
                    </td>
                    <td class="p-3 fw-bold" style="color:#198754;">
                        Rs. <span th:text="${booking.totalCost}">0.00</span>
                    </td>
                    <td class="p-3 text-center">
                        <div th:if="${booking.status == 'PENDING' || booking.status == null || #strings.toString(booking.status) == 'PENDING'}" class="d-flex justify-content-center gap-2">
                            <form th:action="@{/owner/bookings/{id}/approve(id=${booking.id})}" method="post" class="m-0">
                                <button type="submit" class="btn btn-sm fw-bold px-3 text-white" style="background-color: #198754; border-radius: 6px;">
                                    Approve
                                </button>
                            </form>
                            <form th:action="@{/owner/bookings/{id}/reject(id=${booking.id})}" method="post" class="m-0">
                                <button type="submit" class="btn btn-sm fw-bold px-3 text-white" style="background-color: #dc3545; border-radius: 6px;">
                                    Reject
                                </button>
                            </form>
                        </div>

                        <div th:unless="${booking.status == 'PENDING' || booking.status == null || #strings.toString(booking.status) == 'PENDING'}">
                            <span th:text="${booking.status}"
                                  class="badge font-monospace text-uppercase px-3 py-2 rounded-3"
                                  th:style="${#strings.toString(booking.status) == 'CONFIRMED' ? 'background-color: #e8f5e9; color: #198754; border: 1px solid #c8e6c9;' : 'background-color: #ffebee; color: #dc3545; border: 1px solid #ffcdd2;'}">
                                STATUS
                            </span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
