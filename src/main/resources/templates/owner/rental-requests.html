<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#rental-requests})}">
<head>
    <title>Rental Requests - LankaTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/frontend-theme.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="frontend-theme bg-slate-50 font-sans text-slate-800">

<div id="rental-requests" class="container py-5">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
        <div>
            <a href="/owner/dashboard" class="small fw-semibold text-decoration-none d-inline-flex align-items-center gap-1 mb-2" style="color:#0c3966;">
                <i class="fa-solid fa-arrow-left" style="font-size: 0.7rem;"></i> Back to Dashboard
            </a>
            <h1 class="h3 fw-black text-dark mb-0">Incoming Rental Bookings</h1>
        </div>
    </div>

    <div class="card border border-light-subtle rounded-4 shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr class="text-uppercase small fw-bold text-muted" style="background-color:#f1f5f9; letter-spacing:0.5px;">
                    <th class="p-3">Rented Equipment</th>
                    <th class="p-3">Client Contact</th>
                    <th class="p-3">Rental Duration</th>
                    <th class="p-3">Financial Total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${bookings == null || bookings.empty}">
                    <td colspan="4" class="p-5 text-center text-muted fst-italic">
                        No active booking context profiles registered for your tools yet.
                    </td>
                </tr>
                <tr th:each="booking : ${bookings}" class="hover:bg-slate-50/80 transition-colors">
                    <td class="p-4">
                        <span class="font-bold text-slate-900 block" th:text="${booking.tool.name}">Demolition Jackhammer</span>
                        <span class="text-xs text-slate-400" th:text="${booking.tool.category}">Power Tools</span>
                    </td>
                    <td class="p-4">
                        <span class="font-semibold text-slate-800 block" th:text="${booking.user.name}">Customer Name</span>
                        <span class="text-xs text-slate-400" th:text="${booking.user.email}">email@example.com</span>
                    </td>
                    <td class="p-3 text-muted">
                        <i class="fa-regular fa-calendar text-xs text-muted me-1"></i>
                        <span th:text="${booking.startDate}">2026-06-28</span> to <span th:text="${booking.endDate}">2026-06-30</span>
                    </td>
                    <td class="p-4 font-bold text-emerald-600">
                        Rs. <span th:text="${booking.totalPrice != null ? booking.totalPrice : '0.00'}">0.00</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
