<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>LankaTools - Equipment Details</title>
  <div th:replace="~{fragments/layout :: header-css}"></div>
</head>
<body class="bg-gray-50 font-sans flex flex-col min-h-screen">

<nav th:replace="~{fragments/layout :: header-nav}"></nav>

<main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">

  <div class="mb-6">
    <a th:href="@{/tools}" class="inline-flex items-center gap-2 text-sm font-medium text-emerald-600 hover:text-emerald-500 transition">
      <i class="fa-solid fa-arrow-left"></i> Back to Equipment Catalog
    </a>
  </div>

  <div class="grid grid-cols-1 gap-x-8 gap-y-10 lg:grid-cols-2">

    <div class="space-y-6">
      <div class="overflow-hidden rounded-3xl bg-gray-200 border border-gray-100 shadow-sm aspect-w-16 aspect-h-10 max-h-[450px]">
        <img th:src="${tool.imageUrl != null ? tool.imageUrl : '/images/tool-placeholder.png'}"
             alt="Detailed Equipment Source Image"
             class="h-full w-full object-cover object-center">
      </div>

      <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm space-y-4">
        <div class="flex items-center justify-between gap-4">
          <span class="inline-flex items-center rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700 ring-1 ring-inset ring-emerald-600/10"
                th:text="${tool.category}">Category</span>

          <span th:class="${tool.status.name() == 'APPROVED' ? 'inline-flex items-center rounded-full bg-emerald-100 px-3 py-1 text-xs font-bold text-emerald-800' :
                           (tool.status.name() == 'PENDING' ? 'inline-flex items-center rounded-full bg-amber-100 px-3 py-1 text-xs font-bold text-amber-800' :
                           'inline-flex items-center rounded-full bg-rose-100 px-3 py-1 text-xs font-bold text-rose-800')}"
                th:text="${tool.status}">STATUS</span>
        </div>

        <div>
          <h1 class="text-3xl font-black text-gray-900 tracking-tight" th:text="${tool.name}">Equipment Name</h1>
          <p class="text-sm text-gray-400 mt-1">Owner Profile Identification ID: <span class="font-mono font-medium text-gray-600" th:text="${tool.owner != null ? tool.owner : 'System Partner'}">Owner</span></p>
        </div>

        <hr class="border-gray-100">

        <div>
          <h3 class="text-sm font-bold text-gray-900 uppercase tracking-wider">Equipment Description</h3>
          <p class="mt-2 text-base text-gray-600 leading-relaxed whitespace-pre-line" th:text="${tool.description}">Detailed item specifications context notes text representation.</p>
        </div>
      </div>
    </div>

    <div class="space-y-6">

      <div class="bg-white p-6 rounded-3xl border border-gray-200 shadow-md ring-1 ring-black/5 space-y-6 lg:sticky lg:top-8">
        <div>
          <p class="text-sm text-gray-400 uppercase tracking-wider font-bold">Rental Base Pricing</p>
          <p class="text-3xl font-black text-gray-900 mt-1">LKR <span class="text-emerald-600" id="baseDailyRate" th:text="${tool.dailyRate}">0.00</span> <span class="text-sm font-normal text-gray-400">/ day</span></p>
        </div>

        <form th:action="@{/bookings/create}" method="POST" class="space-y-4">
          <input type="hidden" name="toolId" th:value="${tool.id}">

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
              <label for="startDate" class="block class-sm font-bold text-gray-700 text-xs uppercase tracking-wide">Start Date</label>
              <input type="date" id="startDate" name="startDate" required
                     class="mt-1.5 block w-full rounded-xl border-gray-300 shadow-sm text-sm focus:border-emerald-500 focus:ring-emerald-500 transition">
            </div>
            <div>
              <label for="endDate" class="block class-sm font-bold text-gray-700 text-xs uppercase tracking-wide">End Date</label>
              <input type="date" id="endDate" name="endDate" required
                     class="mt-1.5 block w-full rounded-xl border-gray-300 shadow-sm text-sm focus:border-emerald-500 focus:ring-emerald-500 transition">
            </div>
          </div>

          <div id="costPreviewBox" class="hidden rounded-2xl bg-gray-50 p-4 border border-gray-100 space-y-2 animate-fade-in">
            <div class="flex justify-between text-sm text-gray-500">
              <span>Total Rental Duration:</span>
              <span class="font-bold text-gray-900" id="previewDays">0 Days</span>
            </div>
            <div class="flex justify-between text-base font-extrabold text-gray-900 pt-2 border-t border-gray-200/60">
              <span>Estimated Total Cost:</span>
              <span class="text-emerald-600">LKR <span id="previewTotalCost">0.00</span></span>
            </div>
          </div>

          <button type="submit"
                  th:disabled="${tool.status.name() != 'APPROVED'}"
                  th:class="${tool.status.name() == 'APPROVED' ? 'w-full inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-3.5 text-base font-bold text-white shadow-sm hover:bg-emerald-500 transition duration-150 cursor-pointer' :
                               'w-full inline-flex items-center justify-center gap-2 rounded-xl bg-gray-200 px-4 py-3.5 text-base font-bold text-gray-400 cursor-not-allowed'}"
                  th:text="${tool.status.name() == 'APPROVED' ? 'Instant Book Equipment' : 'Booking Unavailable'}">
            Book Button Action
          </button>
        </form>
      </div>

    </div>

  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
  document.addEventListener('DOMContentLoaded', function () {
    const startInput = document.getElementById('startDate');
    const endInput = document.getElementById('endDate');
    const baseRate = parseFloat(document.getElementById('baseDailyRate').textContent) || 0;

    const costPreviewBox = document.getElementById('costPreviewBox');
    const previewDays = document.getElementById('previewDays');
    const previewTotalCost = document.getElementById('previewTotalCost');

    // Setting validation constraint rules limiting past booking operations parameters boundary line mapping configuration
    const systemToday = new Date().toISOString().split('T')[0];
    startInput.min = systemToday;

    function calculateLiveEstimateCost() {
      const startValue = startInput.value;
      const endValue = endInput.value;

      if (startValue) {
        endInput.min = startValue;
      }

      if (startValue && endValue) {
        const d1 = new Date(startValue);
        const d2 = new Date(endValue);

        // Difference processing calculated via standard timestamps logic layers template metrics bounds
        const rawDiffTime = d2.getTime() - d1.getTime();
        const calculatedDays = Math.ceil(rawDiffTime / (1000 * 60 * 60 * 24)) + 1; // Inclusive current layout target boundary parameter range

        if (calculatedDays > 0) {
          previewDays.textContent = calculatedDays + (calculatedDays === 1 ? " Day" : " Days");
          previewTotalCost.textContent = (calculatedDays * baseRate).toFixed(2);
          costPreviewBox.classList.remove('hidden');
        } else {
          costPreviewBox.classList.add('hidden');
        }
      } else {
        costPreviewBox.classList.add('hidden');
      }
    }

    startInput.addEventListener('change', calculateLiveEstimateCost);
    endInput.addEventListener('change', calculateLiveEstimateCost);
  });
</script>

</body>
</html>
