<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LankaTools - Tool Details</title>
    <div th:replace="~{fragments/layout :: header-css}"></div>
</head>

<body class="bg-gray-50 font-sans flex flex-col min-h-screen">

<nav th:replace="~{fragments/layout :: header-nav}"></nav>

<main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">

    <div class="mb-6">
        <a th:href="@{/tools}"
           class="text-sm font-semibold text-gray-600 hover:text-gray-900">
            ← Back to My Equipment
        </a>
    </div>

    <div class="bg-white rounded-3xl border border-gray-200 shadow-sm overflow-hidden">

        <div class="w-full h-64 bg-gray-100">
            <img
                    class="w-full h-full object-cover"
                    th:src="${tool.imageUrl != null ? tool.imageUrl : '/images/tool-placeholder.png'}"
                    alt="Tool Image">
        </div>

        <div class="p-8">

            <h1 class="text-3xl font-black text-gray-900" th:text="${tool.name}">
                Tool Name
            </h1>

            <p class="text-sm text-gray-500 mt-1 font-mono" th:text="'ID: #' + ${tool.id}">
                ID: #000
            </p>


            <div class="mt-4">
                <span th:class="${tool.status.name() == 'APPROVED' ? 'inline-flex items-center rounded-full bg-emerald-100 px-3 py-1 text-xs font-bold text-emerald-800' :
                                 (tool.status.name() == 'PENDING' ? 'inline-flex items-center rounded-full bg-amber-100 px-3 py-1 text-xs font-bold text-amber-800' :
                                 'inline-flex items-center rounded-full bg-rose-100 px-3 py-1 text-xs font-bold text-rose-800')}"
                      th:text="${tool.status}">
                    STATUS
                </span>
            </div>

            <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-6">

                <div>
                    <p class="text-xs text-gray-400 uppercase">Category</p>
                    <p class="text-lg font-semibold text-gray-800" th:text="${tool.category}">
                        Category
                    </p>
                </div>

                <div>
                    <p class="text-xs text-gray-400 uppercase">Daily Rate</p>
                    <p class="text-lg font-black text-emerald-600">
                        LKR <span th:text="${tool.dailyRate}">0</span>
                    </p>
                </div>

                <div class="sm:col-span-2">
                    <p class="text-xs text-gray-400 uppercase">Description</p>
                    <p class="text-gray-700 mt-1" th:text="${tool.description}">
                        Tool description goes here...
                    </p>
                </div>

            </div>

            <div class="mt-10 flex gap-4">

                <a th:href="@{/tools/edit/{id}(id=${tool.id})}"
                   class="inline-flex items-center rounded-xl bg-emerald-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-emerald-500 transition">
                    Edit Tool
                </a>

                <a th:href="@{/tools/delete/{id}(id=${tool.id})}"
                   onclick="return confirm('Are you sure you want to delete this tool?')"
                   class="inline-flex items-center rounded-xl bg-rose-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-rose-500 transition">
                    Delete
                </a>

            </div>

        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
