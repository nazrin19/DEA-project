<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Lankatools — Tool Details</title>
</head>
<body>
<main class="container py-5">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title" th:text="${tool.name}">Tool Name</h2>
                    <p class="text-muted mb-3" th:text="${tool.category}">Category</p>
                    <p th:text="${tool.description}">Tool description</p>
                    <p class="fw-bold fs-5">Rs. <span th:text="${#numbers.formatDecimal(tool.dailyRate, 1, 2)}">0.00</span> / day</p>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="card-title mb-3">Book this tool</h4>
                    <p class="text-muted small">Unavailable dates are disabled automatically.</p>
                    <form th:action="@{/bookings}" method="post">
                        <input type="hidden" name="toolId" th:value="${tool.id}" />
                        <div class="mb-3">
                            <label class="form-label">Start date</label>
                            <input type="text" class="form-control" id="startDate" name="startDate" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">End date</label>
                            <input type="text" class="form-control" id="endDate" name="endDate" required />
                        </div>
                        <div class="alert alert-light border">
                            Estimated total: <strong>Rs. <span id="totalCost">0.00</span></strong>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit booking request</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mt-4">
        <div class="card-body">
            <h4 class="card-title mb-3">Current booking calendar</h4>
            <div class="table-responsive">
                <table class="table table-sm align-middle">
                    <thead>
                    <tr>
                        <th>Dates</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="booking : ${bookings}">
                        <td th:text="${booking.startDate} + ' to ' + ${booking.endDate}">Dates</td>
                        <td><span class="badge" th:classappend="${booking.status.name() == 'PENDING'} ? 'bg-warning text-dark' : (${booking.status.name() == 'RETURNED'} ? 'bg-secondary' : (${booking.status.name() == 'CANCELLED' or booking.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-success'))" th:text="${booking.status}">Status</span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(bookings)}">
                        <td colspan="2" class="text-muted">No bookings yet for this tool.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script th:inline="javascript">
    const blockedDates = /*[[${bookedDates}]]*/ [];
    const dailyRate = /*[[${tool.dailyRate}]]*/ 0;

    const startPicker = flatpickr('#startDate', {
        dateFormat: 'Y-m-d',
        minDate: 'today',
        disable: blockedDates,
        onChange: function(selectedDates) {
            if (selectedDates.length) {
                endPicker.set('minDate', selectedDates[0]);
            }
            updateCost();
        }
    });

    const endPicker = flatpickr('#endDate', {
        dateFormat: 'Y-m-d',
        minDate: 'today',
        disable: blockedDates,
        onChange: updateCost
    });

    function updateCost() {
        const start = startPicker.selectedDates[0];
        const end = endPicker.selectedDates[0];
        const costDisplay = document.getElementById('totalCost');

        if (!start || !end || end < start) {
            costDisplay.textContent = '0.00';
            return;
        }

        const dayCount = Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
        const total = dayCount * dailyRate;
        costDisplay.textContent = total.toFixed(2);
    }
</script>
</body>
</html>
