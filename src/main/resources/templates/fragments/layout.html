<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lankatools — Modern Tool Rental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        /* Custom sleek dark color for the navbar */
        .navbar-custom {
            background-color: #1e293b !important; /* Deep Slate Slate Gray */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .nav-link-custom {
            font-weight: 500;
            color: #cbd5e1 !important;
            transition: color 0.2s ease;
        }
        .nav-link-custom:hover {
            color: #ffffff !important;
        }

        /* ---- Global loading overlay (toggled by /js/spinner.js) ---- */
        #global-loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(26, 39, 68, 0.55);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        #global-loading-overlay.active {
            display: flex;
        }
        #global-loading-overlay .spinner-border {
            width: 3rem;
            height: 3rem;
            color: #f5a623;
        }
    </style>
</head>
<body class="d-flex flex-column h-100">

<!-- Global loading overlay, toggled by /js/spinner.js -->
<div id="global-loading-overlay">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3" th:fragment="header-nav">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
            <span class="fs-4">🔧</span> LankaTools
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-split"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" href="/tools"><i class="bi bi-search"></i> Browse Tools</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('CUSTOMER', 'ADMIN')">
                    <a class="nav-link nav-link-custom" href="/bookings">My Bookings</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('SHOP_OWNER')">
                    <a class="nav-link nav-link-custom text-info" href="/shop/dashboard">My Shop</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link nav-link-custom text-warning" href="/admin/dashboard">Admin Panel</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a class="btn btn-link text-light text-decoration-none fw-medium" href="/login">Login</a>
                    <a class="btn btn-primary px-4 fw-medium" href="/register" style="background-color: #3b82f6; border: none;">Register</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                        <span class="text-light opacity-75">
                            Welcome, <strong class="text-white" sec:authentication="name">User</strong>
                        </span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm px-3">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>



<footer class="footer mt-auto py-4 bg-white border-top text-center text-muted">
    <div class="container">
        <span>&copy; 2026 <strong class="text-dark">LankaTools</strong> — Premium Tool Rental Platform Sri Lanka</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/spinner.js"></script>
</body>
</html>
