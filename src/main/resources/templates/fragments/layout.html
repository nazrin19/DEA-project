<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)"
      class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Lankatools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .transition-all {
            transition: all 0.25s ease-in-out;
        }
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0.75rem 2rem rgba(0,0,0,0.08) !important;
        }
    </style>
</head>
<body class="d-flex flex-column h-100 bg-light-subtle" style="color: #333333;">

<nav class="navbar navbar-expand-lg navbar-dark py-3 shadow-sm" style="background-color: #0c3966;">
    <div class="container">
        <a class="navbar-brand fw-bold text-white tracking-tight" href="/">
            LANKA<span class="opacity-75 fw-light">TOOLS</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link active fw-semibold" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white opacity-75" href="/tools">Browse Tools</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('OWNER')">
                    <a class="nav-link text-warning fw-semibold" href="/owner/dashboard">Shop Dashboard</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link text-info fw-semibold" href="/customer/dashboard">Customer Dashboard</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-danger fw-semibold" href="/admin/dashboard">Admin Dashboard</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a href="/login" class="btn btn-link text-white opacity-75 text-decoration-none fw-semibold px-3">Sign In</a>
                    <a href="/register" class="btn btn-outline-light px-3 rounded-3 fw-semibold transition-all">Register Account</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                    <span class="text-white opacity-75 small">
                        Welcome, <span class="text-white fw-semibold" sec:authentication="name">User</span>
                        <span class="badge bg-purple-subtle text-purple border border-purple-subtle ms-1 font-monospace small"
                              style="font-size: 0.65rem; font-weight: 700;"
                              sec:authorize="hasRole('ADMIN')">ADMIN</span>
                        <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle ms-1 font-monospace small"
                              style="font-size: 0.65rem; font-weight: 700;"
                              sec:authorize="hasRole('OWNER')">SHOP</span>
                        <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle ms-1 font-monospace small"
                              style="font-size: 0.65rem; font-weight: 700;"
                              sec:authorize="hasRole('CUSTOMER')">CUSTOMER</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-light opacity-75 px-3">Sign Out</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<div th:replace="${content}"></div>

<footer class="footer mt-auto py-4 bg-white border-top text-center text-muted">
    <div class="container">
        <span class="small font-monospace">&copy; 2026 Lankatools Asset Management System. All Rights Reserved.</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
