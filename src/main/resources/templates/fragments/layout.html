<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)"
      class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Lankatools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0d6efd;
            --hover-blue: #0b5ed7;
            --navy-dark: #0f172a;
            --midnight-black: #020617;
            --accent-blue: #1e40af;
            --light-white: #f8fafc;
        }
        /* Modern interaction transitions */
        .transition-all {
            transition: all 0.25s ease-in-out;
        }
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0.75rem 2rem rgba(0,0,0,0.08) !important;
        }
        .navbar-custom {
            background-color: var(--midnight-black) !important;
            border-bottom: 2px solid var(--accent-blue);
        }
        .hover-underline:hover {
            text-decoration: underline !important;
        }
    </style>
</head>
<body class="d-flex flex-column h-100 bg-light">

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-white d-flex align-items-center gap-2 tracking-tight" href="/">
            <!-- Geometric LT Logo (Navbar Version - White 'T' & Right Bar) -->
            <svg width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform: translateY(-1px);">
                <!-- Blue 'L' shape -->
                <path d="M20 20 H35 V63 H70 V80 H20 Z" fill="#0d6efd"/>
                <!-- White 'T' shape -->
                <path d="M40 20 H90 V32 H65 V63 H52 V32 H40 Z" fill="#f8fafc"/>
                <!-- White right vertical bar -->
                <path d="M72 38 H85 V80 H72 Z" fill="#f8fafc"/>
            </svg>
            LANKA<span class="text-primary fw-semibold">TOOLS</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link active fw-medium" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="/tools">Browse Tools</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('SHOP_OWNER')">
                    <a class="nav-link text-warning fw-medium" href="/owner/dashboard">Shop Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-danger fw-medium" href="/admin/dashboard">Admin Dashboard</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a href="/login" class="btn btn-link text-white-50 text-decoration-none fw-medium px-3">Sign In</a>
                    <a href="/register" class="btn btn-primary px-3 rounded-3 fw-medium transition-all" style="background-color: var(--primary-blue); border-color: var(--primary-blue);">Register Account</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                    <span class="text-white-50 small">
                        Welcome, <a href="/profile" class="text-white fw-medium text-decoration-none hover-underline" sec:authentication="name">User</a>
                        <span class="badge bg-secondary text-white ms-1 font-monospace small"
                              sec:authorize="hasRole('ADMIN')">Admin</span>
                        <span class="badge bg-warning text-dark ms-1 font-monospace small"
                              sec:authorize="hasRole('SHOP_OWNER')">Shop</span>
                    </span>
                    <a href="/profile" class="btn btn-sm btn-outline-light px-3 fw-medium transition-all">My Profile</a>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-secondary px-3 text-white-50">Sign Out</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<div th:replace="${content}"></div>

<footer class="footer mt-auto py-4 bg-white border-top text-center text-muted">
    <div class="container">
        <span class="small font-monospace">&copy; 2026 Lankatools Asset Management System. All Rights Reserved.</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
