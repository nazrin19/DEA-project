<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Lankatools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0d6efd;
            --hover-blue: #0b5ed7;
            --navy-dark: #0f172a;
            --midnight-black: #020617;
            --light-bg: #f8fafc;
        }
        body {
            background: linear-gradient(to bottom, #020617 0%, #0d6efd 35%, #eff6ff 70%, #ffffff 100%) no-repeat fixed;
            min-height: 100vh;
            margin: 0;
            position: relative;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
            position: relative;
            z-index: 10;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
        }
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        .btn-login {
            background-color: var(--midnight-black);
            border-color: var(--midnight-black);
            color: white;
            font-weight: 600;
            padding: 12px;
            transition: all 0.2s ease-in-out;
        }
        .btn-login:hover {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
            color: white;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <!-- Clean Form Header -->
        <div class="text-center pt-4 pb-2 px-4">
            <h4 class="fw-bold text-dark mb-1">Welcome Back</h4>
            <p class="text-muted small mb-0">Sign in to your Lankatools account</p>
            <hr class="my-3 opacity-25" style="border-top: 1px solid var(--primary-blue);">
        </div>
        
        <div class="card-body p-4 pt-0">
            <!-- Registration Success Alert -->
            <div th:if="${param.registered}" class="alert alert-success d-flex align-items-center gap-2 rounded-3 mb-3 py-2" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/></svg>
                <div class="small fw-medium">Registration successful! Please sign in.</div>
            </div>

            <!-- Logout Success Alert -->
            <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center gap-2 rounded-3 mb-3 py-2" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>
                <div class="small fw-medium">You have signed out successfully.</div>
            </div>

            <!-- Login Error Alert -->
            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3 mb-3 py-2" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>
                <div class="small fw-medium">Invalid email address or password.</div>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label text-muted small fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="text-muted" viewBox="0 0 16 16"><path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2zm13 2.383-4.758 2.855L15 11.114V5.383zm-.03 5.662L8.558 7.33 8 7.665l-.558-.335L2.03 11.045A1 1 0 0 0 2 12h12a1 1 0 0 0 .97-.955zM1 11.114l4.758-2.876L1 5.383v5.731z"/></svg>
                        </span>
                        <input type="email" name="email" id="email" class="form-control bg-light border-start-0" placeholder="name@example.com" required />
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-muted small fw-semibold mb-2">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="text-muted" viewBox="0 0 16 16"><path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/></svg>
                        </span>
                        <input type="password" name="password" id="password" class="form-control bg-light border-start-0" placeholder="••••••••" required />
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100 rounded-3">Sign In</button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted small mb-0">Don't have an account? <a href="/register" class="text-primary fw-bold text-decoration-none">Create Account</a></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
