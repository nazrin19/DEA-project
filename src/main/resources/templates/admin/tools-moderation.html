<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanka Tools - Admin Moderation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

<div class="max-w-6xl mx-auto p-6">
    <header class="mb-8 flex justify-between items-center p-6 rounded-xl border border-slate-200 shadow-sm" style="background-color:#0c3966;">
        <div>
            <h1 class="text-2xl font-black tracking-tight flex items-center gap-2 text-white">
                🛡️ Admin Moderation Desk
            </h1>
            <p class="text-white opacity-75 text-sm mt-0.5">Approve or reject incoming hardware tools listings</p>
        </div>
        <a href="/admin/dashboard" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all bg-white" style="color:#0c3966;">
            Back to Dashboard
        </a>
    </header>

    <div th:if="${success}" class="mb-6 p-4 rounded-lg text-sm font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200">
        ✨ <span th:text="${success}">Action completed successfully.</span>
    </div>

    <div th:if="${tools == null || tools.empty}" class="bg-white text-center p-12 rounded-xl border border-dashed border-slate-300 text-slate-500">
        🎉 All catchments clear! No custom listings are currently waiting for admin validation.
    </div>

    <div th:unless="${tools == null || tools.empty}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <th:block th:each="tool : ${tools}">
            <div th:if="${tool.status.name() == 'PENDING'}"
                 class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between transition-all hover:border-slate-300 hover:shadow-md">

                <div>
                    <div class="p-4 pb-0">
                        <div class="w-full h-48 bg-slate-100 rounded-lg border border-slate-200 flex items-center justify-center overflow-hidden position-relative">

                            <img th:if="${tool.imageUrl != null && !#strings.isEmpty(tool.imageUrl)}"
                                 th:src="@{${tool.imageUrl}}"
                                 class="w-full h-full object-contain p-2"
                                 alt="Hardware preview">

                            <div th:unless="${tool.imageUrl != null && !#strings.isEmpty(tool.imageUrl)}" class="text-center text-slate-400">
                                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="mx-auto mb-1 opacity-60" viewBox="0 0 16 16">
                                    <path d="M1 0 0 1l2.2 3.081a1 1 0 0 0 .815.419h.07a1 1 0 0 1 .708.293l2.675 2.675-2.617 2.654A3.003 3.003 0 0 0 0 13a3 3 0 0 0 5.291 1.917l2.654-2.617 2.675 2.675a1 1 0 0 1 .293.708v.07a1 1 0 0 0 .419.815L15 16l1-1-3.081-2.2a1 1 0 0 0-.815-.419h-.07a1 1 0 0 1-.708-.293L8.65 9.414l4-4 .121.121a1 1 0 0 0 1.414 0l1.586-1.586a1 1 0 0 0 0-1.414l-4-4a1 1 0 0 0-1.414 0L8.771 3.121l-4-4z"/>
                                </svg>
                                <span class="text-xs font-mono tracking-wider block">NO PREVIEW AVAILABLE</span>
                            </div>
                        </div>
                    </div>

                    <div class="p-5">
                        <span class="px-2.5 py-0.5 text-xs font-bold bg-blue-50 text-blue-700 rounded-full border border-blue-200"
                              th:text="${tool.category}">
                            Category
                        </span>
                        <h3 class="text-lg font-bold mt-2" style="color:#0c3966;" th:text="${tool.name}">Tool Title</h3>
                        <p class="text-sm text-slate-500 mt-1 line-clamp-3" th:text="${tool.description}">Description context</p>
                        <p class="font-extrabold mt-3 text-lg" style="color:#0c3966;" th:text="'Rs. ' + ${tool.dailyRate} + ' / day'">Rs. 0.00 / day</p>
                    </div>
                </div>

                <div class="p-5 bg-slate-50 border-t border-slate-200 grid grid-cols-2 gap-3">
                    <form th:action="@{/admin/tools/{id}/status(id=${tool.id})}" method="post">
                        <input type="hidden" name="status" value="APPROVED"/>
                        <button type="submit" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-sm transition-all cursor-pointer">
                            Approve
                        </button>
                    </form>

                    <form th:action="@{/admin/tools/{id}/status(id=${tool.id})}" method="post">
                        <input type="hidden" name="status" value="REJECTED"/>
                        <button type="submit" class="w-full py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-sm transition-all cursor-pointer">
                            Reject
                        </button>
                    </form>
                </div>
            </div>
        </th:block>
    </div>
</div>

</body>
</html>
