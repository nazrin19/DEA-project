<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#moderation-container})}">
<head>
    <title>Lanka Tools - Admin Moderation</title>
</head>
<body>

<div id="moderation-container" class="container my-5">

    <header class="row mb-5 g-3 p-4 rounded-4 text-white shadow-sm align-items-center" style="background-color: #0c3966;">
        <div class="col-sm-8">
            <h1 class="h3 fw-bold tracking-tight mb-1 text-white d-flex align-items-center gap-2">
                🛡️ Admin Moderation Desk
            </h1>
            <p class="opacity-75 mb-0 small">Approve or reject incoming hardware tools listings</p>
        </div>
        <div class="col-sm-4 text-sm-end">
            <a href="/admin/dashboard" class="btn btn-outline-light px-4 py-2 fw-semibold rounded-3 text-uppercase small tracking-wide">
                Back to Dashboard
            </a>
        </div>
    </header>

    <div th:if="${success}" class="alert alert-success mb-4 rounded-4 fw-semibold shadow-sm" role="alert">
        ✨ <span th:text="${success}">Action completed successfully.</span>
    </div>

    <div th:if="${tools == null || tools.empty}" class="bg-white text-center p-5 rounded-4 border border-light shadow-sm text-muted py-5">
        <span class="fs-4 d-block mb-2">🎉</span> All catchments clear! No custom listings are currently waiting for admin validation.
    </div>

    <div th:unless="${tools == null || tools.empty}" class="row g-4">

        <th:block th:each="tool : ${tools}">
            <div th:if="${#strings.toString(tool.status) == 'PENDING'}" class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden bg-white d-flex flex-column justify-content-between">

                    <div>
                        <img th:src="${tool.imageUrl != null && !tool.imageUrl.empty} ? ${tool.imageUrl} : '/uploads/default-placeholder.png'"
                             class="w-100 object-fit-cover border-bottom"
                             style="height: 200px;"
                             alt="Hardware preview"
                             onerror="this.src='/uploads/default-placeholder.png'">

                        <div class="p-4">
                            <span class="badge text-secondary font-monospace px-2.5 py-1.5 rounded-pill mb-2 text-uppercase"
                                  style="background-color: #eaeef6; color: #0c3966 !important; font-size: 0.7rem; font-weight: 700;"
                                  th:text="${tool.category}">
                                Category
                            </span>
                            <h3 class="h5 fw-bold mt-1 mb-2" style="color: #0c3966;" th:text="${tool.name}">Tool Title</h3>
                            <p class="text-muted small mb-3" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;" th:text="${tool.description}">Description context</p>
                            <p class="text-success fw-bold h5 mb-0" th:text="'Rs. ' + ${tool.dailyRate} + ' / day'">Rs. 0.00 / day</p>
                        </div>
                    </div>

                    <div class="p-4 bg-light border-top d-flex gap-3" style="--bs-light-rgb: 248, 250, 252;">
                        <div class="w-50">
                            <form th:action="@{/admin/tools/{id}/status(id=${tool.id})}" method="post">
                                <input type="hidden" name="status" value="APPROVED"/>
                                <button type="submit" class="btn btn-success w-100 py-2 fw-bold text-uppercase rounded-3 small shadow-sm" style="font-size: 0.8rem; letter-spacing: 0.5px;">
                                    Approve
                                </button>
                            </form>
                        </div>

                        <div class="w-50">
                            <form th:action="@{/admin/tools/{id}/status(id=${tool.id})}" method="post">
                                <input type="hidden" name="status" value="REJECTED"/>
                                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold text-uppercase rounded-3 small shadow-sm" style="font-size: 0.8rem; letter-spacing: 0.5px;">
                                    Reject
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </th:block>
    </div>
</div>

</body>
</html>
