<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lankatools | Shop Notifications</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Lankatools Dashboard</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/notifications">
                🔔 Notifications <span class="badge bg-danger" th:text="${notificationCount}">0</span>
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">📋 Pending Shop Requests</h2>

    <div th:if="${bookings.isEmpty()}" class="alert alert-success shadow-sm">
        🎉 All caught up! There are no pending tool requests right now.
    </div>

    <div th:unless="${bookings.isEmpty()}" class="row">
        <div th:each="booking : ${bookings}" class="col-md-6 mb-3">
            <div class="card shadow-sm border-start border-warning border-4">
                <div class="card-body">
                    <h5 class="card-title text-primary" th:text="${booking.toolName != null ? booking.toolName : 'Tool Request'}">Tool Name</h5>
                    <p class="card-text">
                        <strong>Status:</strong> <span class="badge bg-warning text-dark" th:text="${booking.status}">PENDING</span><br>
                        <strong>Booking ID:</strong> <span th:text="${booking.id}">ID</span>
                    </p>
                    <div class="d-flex gap-2 mt-3">
                        <button class="btn btn-success btn-sm px-3">Approve</button>
                        <button class="btn btn-danger btn-sm px-3">Reject</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
