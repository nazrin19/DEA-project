<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Lankatools — My Bookings</title>
</head>
<body>
<main class="container py-5">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">My bookings</h2>
            <p class="text-muted mb-0">Track every booking request, status change, and cost update.</p>
        </div>
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(bookings)}">
        <div class="col-12" th:each="booking : ${bookings}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-7">
                            <h5 class="card-title mb-1" th:text="${booking.tool.name}">Tool name</h5>
                            <p class="text-muted mb-2" th:text="${booking.tool.category}">Category</p>
                            <p class="mb-2"><strong>Dates:</strong> <span th:text="${booking.startDate} + ' to ' + ${booking.endDate}"></span></p>
                            <p class="mb-2"><strong>Total cost:</strong> Rs. <span th:text="${#numbers.formatDecimal(booking.totalCost, 1, 2)}">0.00</span></p>
                        </div>
                        <div class="col-md-5 text-md-end">
                            <span class="badge rounded-pill px-3 py-2 mb-3"
                                  th:classappend="${booking.status.name() == 'PENDING'} ? 'bg-warning text-dark' : (${booking.status.name() == 'RETURNED'} ? 'bg-secondary' : (${booking.status.name() == 'CANCELLED' or booking.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-success'))"
                                  th:text="${booking.status}">Status</span>

                            <div class="d-flex flex-wrap justify-content-md-end gap-2 mt-2">
                                <form th:if="${booking.status.name() != 'CANCELLED' and booking.status.name() != 'REJECTED' and booking.status.name() != 'RETURNED'}" th:action="@{/bookings/{id}/cancel(id=${booking.id})}" method="post">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">Cancel</button>
                                </form>
                                <form th:if="${booking.status.name() == 'CONFIRMED' or booking.status.name() == 'ACTIVE'}" th:action="@{/bookings/{id}/return(id=${booking.id})}" method="post">
                                    <button class="btn btn-outline-success btn-sm" type="submit">Mark returned</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <div class="d-flex flex-wrap gap-2">
                            <span class="badge rounded-pill px-3 py-2" th:classappend="${booking.status.name() == 'PENDING' or booking.status.name() == 'CONFIRMED' or booking.status.name() == 'ACTIVE' or booking.status.name() == 'RETURNED'} ? 'bg-primary' : 'bg-light text-muted'">Pending</span>
                            <span class="badge rounded-pill px-3 py-2" th:classappend="${booking.status.name() == 'CONFIRMED' or booking.status.name() == 'ACTIVE' or booking.status.name() == 'RETURNED'} ? 'bg-primary' : 'bg-light text-muted'">Confirmed</span>
                            <span class="badge rounded-pill px-3 py-2" th:classappend="${booking.status.name() == 'ACTIVE' or booking.status.name() == 'RETURNED'} ? 'bg-primary' : 'bg-light text-muted'">Active</span>
                            <span class="badge rounded-pill px-3 py-2" th:classappend="${booking.status.name() == 'RETURNED'} ? 'bg-primary' : 'bg-light text-muted'">Returned</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-light border" th:if="${#lists.isEmpty(bookings)}">
        You do not have any bookings yet.
    </div>
</main>
</body>
</html>
