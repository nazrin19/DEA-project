<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Catalog</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 font-sans">

<nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">

            <span class="text-xl font-bold text-blue-600">
                Tool Share
            </span>

        <div class="space-x-4">
            <a href="#" class="text-gray-600 hover:text-blue-600 font-medium">
                Catalog
            </a>

            <a href="add-tool.html"
               class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                Add Tool
            </a>
        </div>

    </div>
</nav>


<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <h1 class="text-3xl font-bold text-gray-800 mb-6">
        Tool Catalog
    </h1>

    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">

        <form id="filterForm" class="grid grid-cols-1 md:grid-cols-5 gap-4">

            <div class="md:col-span-2">
                <label for="search" class="block text-sm font-medium text-gray-700 mb-1">
                    Search Tools
                </label>

                <input
                        type="text"
                        id="search"
                        name="search"
                        placeholder="e.g. Cordless Drill, Ladder..."
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label for="category" class="block text-sm font-medium text-gray-700 mb-1">
                    Category
                </label>

                <select id="category"
                        name="category"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">

                    <option value="">All Categories</option>
                    <option value="power-tools">Power Tools</option>
                    <option value="hand-tools">Hand Tools</option>
                    <option value="gardening">Gardening</option>
                    <option value="plumbing">Plumbing</option>

                </select>
            </div>

            <div>
                <label for="sortBy" class="block text-sm font-medium text-gray-700 mb-1">
                    Sort By Price
                </label>

                <select id="sortBy"
                        name="sortBy"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">

                    <option value="dailyRate,asc">Price: Low to High</option>
                    <option value="dailyRate,desc">Price: High to Low</option>

                </select>
            </div>

            <div class="flex items-end">
                <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                    Search
                </button>
            </div>

        </form>

    </section>

    <section>

        <div id="toolGrid"
             class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition">

                <div class="relative h-48">
                    <img
                            src="https://images.unsplash.com/photo-1504148455328-c376907d081c?w=500"
                            alt="Power Drill"
                            class="w-full h-full object-cover">

                    <span class="absolute top-3 right-3 bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full">
                            APPROVED
                        </span>
                </div>

                <div class="p-5">

                        <span class="text-xs uppercase text-gray-400 font-semibold">
                            Power Tools
                        </span>

                    <h3 class="text-lg font-bold text-gray-900 mt-1">
                        DeWalt Cordless Drill
                    </h3>

                    <p class="text-sm text-gray-500 mt-2">
                        High performance 20V Max drill with brushless motor.
                    </p>

                    <div class="mt-4 flex justify-between items-center">

                        <div>
                                <span class="text-xl font-bold text-blue-600">
                                    $25
                                </span>
                            <span class="text-gray-500 text-sm">
                                    / day
                                </span>
                        </div>

                        <button
                                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                            View Details
                        </button>

                    </div>

                </div>

            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden opacity-80">

                <div class="relative h-48">
                    <img
                            src="https://images.unsplash.com/photo-1581244277943-fe4a9c777189?w=500"
                            alt="Lawn Mower"
                            class="w-full h-full object-cover">

                    <span class="absolute top-3 right-3 bg-yellow-100 text-yellow-800 text-xs font-semibold px-3 py-1 rounded-full">
                            PENDING
                        </span>
                </div>

                <div class="p-5">

                        <span class="text-xs uppercase text-gray-400 font-semibold">
                            Gardening
                        </span>

                    <h3 class="text-lg font-bold text-gray-900 mt-1">
                        Electric Lawn Mower
                    </h3>

                    <p class="text-sm text-gray-500 mt-2">
                        Quiet, efficient electric mower ideal for medium lawns.
                    </p>

                    <div class="mt-4 flex justify-between items-center">

                        <div>
                                <span class="text-xl font-bold text-gray-700">
                                    $45
                                </span>
                            <span class="text-gray-500 text-sm">
                                    / day
                                </span>
                        </div>

                        <button
                                disabled
                                class="bg-gray-100 text-gray-400 px-4 py-2 rounded-lg cursor-not-allowed">
                            Pending Approval
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>

</body>
</html>
