<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::#content})}">

<head>
    <title>LankaTools - Register New Equipment</title>
</head>

<body>
<div id="content">

    <div class="container py-5" style="max-width: 700px;">

        <div class="mb-4 text-center">
            <h1 class="fw-bold">Register New Equipment</h1>
            <p class="text-muted">Add your tools to the marketplace and start earning through rentals.</p>
        </div>

        <form th:action="@{/tools/add}"
              th:object="${tool}"
              method="post"
              enctype="multipart/form-data"
              class="bg-white p-4 p-md-5 rounded-3 border shadow-sm">

            <div class="mb-4">
                <label class="form-label fw-bold text-uppercase small">Equipment Photo</label>

                <div class="border border-2 border-dashed rounded-3 p-4 text-center bg-light position-relative" style="cursor: pointer;">

                    <input type="file"
                           name="imageFile"
                           id="imageFile"
                           accept="image/png,image/jpeg"
                           required
                           class="position-absolute top-0 start-0 w-100 h-100 opacity-0"
                           style="cursor: pointer;">

                    <div id="uploadPlaceholder">
                        <p class="text-muted small mb-0">Click to upload JPG or PNG (Maximum 5MB)</p>
                    </div>

                    <img id="imagePreview" src="#" alt="Preview" class="d-none w-100 rounded-3 shadow-sm" style="height: 200px; object-fit: cover;">
                </div>
            </div>

            <div class="row g-3 mb-4">

                <div class="col-sm-6">
                    <label for="name" class="form-label fw-bold small">Tool Name</label>
                    <input type="text" id="name" th:field="*{name}" required
                           placeholder="e.g. Industrial Drill Machine"
                           class="form-control">
                </div>

                <div class="col-sm-6">
                    <label for="category" class="form-label fw-bold small">Category</label>
                    <select id="category" th:field="*{category}" required class="form-select">
                        <option value="">Select Category</option>
                        <option value="Industrial Tools">Industrial Tools</option>
                        <option value="Hand Tools">Hand Tools</option>
                        <option value="Electrical Equipment">Electrical Equipment</option>
                        <option value="Garden & Outdoor">Garden & Outdoor</option>
                    </select>
                </div>

            </div>

            <div class="mb-4">
                <label for="dailyRate" class="form-label fw-bold small">Daily Rental Rate (LKR)</label>
                <div class="input-group">
                    <span class="input-group-text">Rs.</span>
                    <input type="number" id="dailyRate" th:field="*{dailyRate}" required min="0" step="0.01"
                           placeholder="0.00" class="form-control fw-bold text-success">
                </div>
            </div>

            <div class="mb-4">
                <label for="description" class="form-label fw-bold small">Description</label>
                <textarea id="description" th:field="*{description}" rows="4" required
                          placeholder="Describe the tool condition, specifications, and rental information..."
                          class="form-control"></textarea>
            </div>

            <div class="d-flex gap-3 pt-2">
                <button type="submit" class="btn btn-success flex-grow-1 rounded-3 py-2 fw-bold">
                    Submit for Approval
                </button>
                <a th:href="@{/tools}" class="btn btn-outline-secondary rounded-3 px-4">
                    Cancel
                </a>
            </div>

        </form>

    </div>

    <script>
        document.getElementById('imageFile').addEventListener('change', function () {
            const file = this.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert("File is too large. Maximum size is 5MB.");
                this.value = "";
                return;
            }

            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('uploadPlaceholder');

            preview.src = URL.createObjectURL(file);
            preview.classList.remove('d-none');
            placeholder.classList.add('d-none');
        });
    </script>

</div>
</body>
</html>
