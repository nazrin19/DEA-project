<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LankaTools - Register New Equipment</title>
    <div th:replace="~{fragments/layout :: header-css}"></div>
</head>
<body class="bg-gray-50 font-sans flex flex-col min-h-screen">

<nav th:replace="~{fragments/layout :: header-nav}"></nav>

<main class="flex-grow max-w-3xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">

    <div class="mb-8 text-center">
        <h1 class="text-3xl font-black text-gray-900 tracking-tight">Register New Equipment</h1>
        <p class="text-sm text-gray-500 mt-2">Add your industrial or local tools to the marketplace catalog for rental earnings.</p>
    </div>

    <form th:action="@{/tools/add}" th:object="${tool}" method="POST" enctype="multipart/form-data"
          class="bg-white p-8 rounded-3xl border border-gray-200 shadow-xl space-y-6">

        <div class="space-y-4">
            <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider">Equipment Photo</label>
            <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-3xl p-6 bg-gray-50 hover:bg-gray-100 transition cursor-pointer relative overflow-hidden group">

                <input type="file" name="imageFile" id="imageFile" accept="image/png, image/jpeg" required
                       class="absolute inset-0 opacity-0 cursor-pointer z-10">

                <div id="uploadPlaceholder" class="text-center space-y-2">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-gray-400 group-hover:text-emerald-500 transition"></i>
                    <p class="text-xs text-gray-500">Click or drag to upload JPG or PNG (Max 5MB)</p>
                </div>

                <img id="imagePreview" src="#" alt="Preview" class="hidden h-48 w-full object-cover rounded-2xl shadow-md">
            </div>
        </div>

        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <div class="space-y-2">
                <label for="name" class="block text-sm font-bold text-gray-700">Tool Name</label>
                <input type="text" th:field="*{name}" id="name" required placeholder="e.g. Industrial Drill Machine"
                       class="block w-full rounded-xl border-gray-300 shadow-sm text-sm focus:border-emerald-500 focus:ring-emerald-500 transition">
            </div>

            <div class="space-y-2">
                <label for="category" class="block text-sm font-bold text-gray-700">Category</label>
                <select th:field="*{category}" id="category" required
                        class="block w-full rounded-xl border-gray-300 shadow-sm text-sm focus:border-emerald-500 focus:ring-emerald-500 transition">
                    <option value="">Select Category</option>
                    <option value="Industrial">Industrial Tools</option>
                    <option value="HandTools">Hand Tools</option>
                    <option value="Electrical">Electrical Equipment</option>
                    <option value="Garden">Garden & Outdoor</option>
                </select>
            </div>
        </div>

        <div class="space-y-2">
            <label for="dailyRate" class="block text-sm font-bold text-gray-700">Daily Rental Rate (LKR)</label>
            <div class="relative rounded-xl shadow-sm">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                    <span class="text-gray-500 text-sm font-bold">Rs.</span>
                </div>
                <input type="number" th:field="*{dailyRate}" id="dailyRate" required step="0.01" min="0" placeholder="0.00"
                       class="block w-full rounded-xl border-gray-300 pl-12 text-sm font-bold text-emerald-600 focus:border-emerald-500 focus:ring-emerald-500 transition">
            </div>
        </div>

        <div class="space-y-2">
            <label for="description" class="block text-sm font-bold text-gray-700">Description</label>
            <textarea th:field="*{description}" id="description" rows="4" required placeholder="Describe the tool condition, power specs, and rental terms..."
                      class="block w-full rounded-xl border-gray-300 shadow-sm text-sm focus:border-emerald-500 focus:ring-emerald-500 transition"></textarea>
        </div>

        <div class="pt-4 flex gap-4">
            <button type="submit"
                    class="flex-1 rounded-xl bg-emerald-600 px-4 py-3.5 text-base font-bold text-white shadow-lg hover:bg-emerald-500 transition duration-150 transform hover:-translate-y-0.5">
                Submit for Approval
            </button>
            <a th:href="@{/tools}"
               class="px-6 py-3.5 rounded-xl border border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-50 transition">
                Cancel
            </a>
        </div>

    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
    document.getElementById('imageFile').onchange = evt => {
        const [file] = document.getElementById('imageFile').files;
        if (file) {
            if (file.size > 5 * 1024 * 1024) {
                alert("File is too large! Maximum limit is 5MB.");
                document.getElementById('imageFile').value = "";
                return;
            }

            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('uploadPlaceholder');

            preview.src = URL.createObjectURL(file);
            preview.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }
    }
</script>

</body>
</html>/html>
