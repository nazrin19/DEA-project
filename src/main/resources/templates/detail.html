<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tool.name} + ' - LankaTools'">Tool Details - LankaTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/frontend-theme.css">
</head>
<body class="frontend-theme bg-slate-50 text-slate-800 min-h-screen font-sans">

<header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/" class="text-2xl font-extrabold text-blue-600 tracking-tight">
            Lanka<span class="text-slate-900">Tools</span>
        </a>
        <nav class="flex space-x-4">
            <a href="/" class="text-slate-600 hover:text-blue-600 font-medium transition">Catalog</a>
            <a href="/owner/tools/add" class="text-slate-600 hover:text-blue-600 transition">List a Tool</a>
        </nav>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">

    <div class="mb-8">
        <a href="/" class="text-sm font-semibold text-blue-600 hover:text-blue-700 flex items-center space-x-1">
            <span>&larr; Back to Catalog</span>
        </a>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden grid grid-cols-1 md:grid-cols-2 gap-0">

        <div class="bg-slate-100 p-8 flex items-center justify-center border-b md:border-b-0 md:border-r border-slate-200">
            <div class="w-full max-w-md aspect-square bg-white rounded-xl shadow-inner overflow-hidden flex items-center justify-center relative">
                <img th:src="@{${tool.imageUrl}}"
                     onerror="this.onerror=null; this.src='/images/default-tool.png';"
                     class="object-contain w-full h-full p-4"
                     alt="Detailed Tool Image">
            </div>
        </div>

        <div class="p-8 sm:p-10 flex flex-col justify-between">

            <div>
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold uppercase text-blue-600 tracking-wider bg-blue-50 px-3 py-1 rounded-full border border-blue-100"
                          th:text="${tool.category}">Category</span>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200"
                          th:text="${tool.status}">AVAILABLE</span>
                </div>

                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mt-4" th:text="${tool.name}">Industrial Jackhammer</h1>

                <div class="mt-4 py-3 px-4 bg-slate-50 border border-slate-150 rounded-xl inline-flex items-baseline space-x-2">
                    <span class="text-sm text-slate-500 font-medium">Rental Rate:</span>
                    <span class="text-2xl font-black text-blue-600">
                            Rs. <span th:text="${tool.dailyRate}">0.00</span>
                        </span>
                    <span class="text-xs text-slate-400 font-normal">/ per day</span>
                </div>

                <div class="mt-8">
                    <h2 class="text-sm font-bold uppercase text-slate-400 tracking-wider">Product Description</h2>
                    <p class="text-slate-600 mt-2 leading-relaxed whitespace-pre-line" th:text="${tool.description}">
                        No description provided for this item.
                    </p>
                </div>
            </div>

            <div class="mt-10 pt-6 border-t border-slate-100">
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-6">
                    <p class="text-sm text-blue-800 font-medium">
                        Owned by: <span class="font-bold" th:text="${tool.owner.name}">Shop Owner Name</span>
                    </p>
                    <p class="text-xs text-blue-600 mt-0.5">Verified Merchant Account</p>
                </div>

                <a th:href="@{/bookings/checkout(toolId=${tool.id})}"
                   class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-100 transition duration-200 transform active:scale-98">
                    Book This Equipment
                </a>
            </div>

        </div>
    </div>

</main>

</body>
</html>
