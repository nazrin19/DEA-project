<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#tool-detail})}">
<head>
    <title th:text="${tool.name} + ' - LankaTools'">Tool Details - LankaTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/frontend-theme.css">
</head>
<body class="frontend-theme bg-slate-50 text-slate-800 min-h-screen font-sans">

<div id="tool-detail" class="container py-5">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <div class="mb-4">
        <a href="/" class="small fw-semibold text-decoration-none d-inline-flex align-items-center gap-1" style="color:#0c3966;">
            <i class="fa-solid fa-arrow-left" style="font-size: 0.7rem;"></i> Back to Catalog
        </a>
    </div>

    <div class="card border border-light-subtle rounded-4 shadow-sm overflow-hidden">
        <div class="row g-0">

            <div class="col-12 col-md-6 d-flex align-items-center justify-content-center p-4 p-md-5 bg-light-subtle border-end">
                <div class="w-100 bg-white rounded-4 shadow-sm d-flex align-items-center justify-content-center overflow-hidden" style="max-width: 420px; aspect-ratio: 1 / 1;">
                    <img th:src="@{${tool.imageUrl}}"
                         onerror="this.onerror=null; this.src='/images/default-tool.png';"
                         class="p-3"
                         style="max-width: 100%; max-height: 100%; object-fit: contain;"
                         alt="Detailed Tool Image">
                </div>
            </div>

            <div class="col-12 col-md-6 p-4 p-md-5 d-flex flex-column justify-content-between">

                <div>
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <span class="small fw-bold text-uppercase rounded-pill px-3 py-1"
                              style="color:#0c3966; background-color:#eef3f8; letter-spacing:0.5px; font-size: 0.7rem;"
                              th:text="${tool.category}">Category</span>
                        <span class="small fw-semibold px-3 py-1 rounded-3 bg-success-subtle text-success-emphasis border border-success-subtle"
                              th:text="${tool.status}">AVAILABLE</span>
                    </div>

                    <h1 class="h3 fw-black text-dark mb-3" th:text="${tool.name}">Industrial Jackhammer</h1>

                    <div class="d-inline-flex align-items-baseline gap-2 py-2 px-3 rounded-3 mb-4" style="background-color:#f8fafc; border:1px solid #eef1f4;">
                        <span class="small text-muted fw-medium">Rental Rate:</span>
                        <span class="fs-4 fw-black" style="color:#0c3966;">
                            Rs. <span th:text="${tool.dailyRate}">0.00</span>
                        </span>
                        <span class="small text-muted">/ per day</span>
                    </div>

                    <div class="mt-4">
                        <h2 class="small fw-bold text-uppercase text-muted" style="letter-spacing:0.5px;">Product Description</h2>
                        <p class="text-muted mt-2" style="white-space: pre-line;" th:text="${tool.description}">
                            No description provided for this item.
                        </p>
                    </div>
                </div>

                <div class="mt-4 pt-4 border-top">
                    <div class="rounded-4 p-3 mb-4" style="background-color:#eef3f8; border:1px solid #dde7f0;">
                        <p class="small fw-medium mb-0" style="color:#0c3966;">
                            Owned by: <span class="fw-bold" th:text="${tool.owner.name}">Shop Owner Name</span>
                        </p>
                        <p class="mb-0 mt-1" style="color:#0c3966; font-size: 0.75rem;">Verified Merchant Account</p>
                    </div>

                    <a th:href="@{/bookings/checkout(toolId=${tool.id})}"
                       class="btn text-white fw-bold rounded-3 py-3 w-100" style="background-color:#0c3966;">
                        Book This Equipment
                    </a>
                </div>

            </div>
        </div>
    </div>

</div>

</body>
</html>
