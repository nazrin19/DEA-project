spring.application.name=Lankatools


# DATABASE


spring.datasource.url=jdbc:mysql://localhost:3306/lankatools?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# THYMELEAF
spring.thymeleaf.cache=false


# FILE UPLOADS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.dir=uploads/


# MAIL (Commented out until we get our real App Password)
# ===========================
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=TEAM_EMAIL_HERE
# spring.mail.password=GMAIL_APP_PASSWORD_HERE
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# SEED DATA INITIALIZATION
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# SERVER
server.port=8080