spring.application.name=Lankatools


# DATABASE


spring.datasource.url=jdbc:mysql://localhost:3306/lankatools?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# THYMELEAF
spring.thymeleaf.cache=false


# FILE UPLOADS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.dir=uploads/


# MAIL CONFIGURATION (ACTIVE)
# ===========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lankatools.testmail@gmail.com
spring.mail.password=YOUR_TEMP_SECRET_KEY
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# SERVER
server.port=8080