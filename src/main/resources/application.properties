spring.application.name=Lankatools


# Variables provided securely using Render's environment dashboard
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.sql.init.resources=classpath:data.sql
spring.sql.init.continue-on-error=false


spring.thymeleaf.cache=false


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.dir=uploads/




spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=nazreenabanu85@gmail.com
# Extracted safely into a variable so your Google account app-password stays secret
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

server.port=${PORT:8080}