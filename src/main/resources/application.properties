spring.application.name=Lankatools

# DATABASE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3306/lankatools?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================
# Changed to "update" so your database tables don't get wiped out.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# DATA SEEDING CONFIGURATION (EVERYDAY / TEAM MODE)

# Changed to "never" so it stops trying to insert duplicate rows.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

spring.sql.init.resources=classpath:data.sql

spring.sql.init.continue-on-error=false


# THYMELEAF TEMPLATE ENGINE
spring.thymeleaf.cache=false

# FILE UPLOADS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.dir=uploads/

# MAIL CONFIGURATION
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=lankatools.testmail@gmail.com
spring.mail.password=mock-password

# EMBEDDED SERVER CONFIGURATION
server.port=8080