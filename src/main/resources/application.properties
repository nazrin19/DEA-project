spring.application.name=Lankatools

# ============================================================
# DYNAMIC DATABASE CONFIGURATION (PROVISIONED BY RENDER)
# ============================================================
# Variables provided securely using Render's environment dashboard
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================
# "update" preserves table schemas and persistent user records without wipeouts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# DATA SEEDING CONFIGURATION (EVERYDAY / TEAM MODE)
# ============================================================
# "never" bypasses duplicate primary key seeding crashes during cloud restarts
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.sql.init.resources=classpath:data.sql
spring.sql.init.continue-on-error=false

# ============================================================
# THYMELEAF TEMPLATE ENGINE
# ============================================================
spring.thymeleaf.cache=false

# ============================================================
# FILE UPLOADS
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.dir=uploads/

# ============================================================
# REAL PRODUCTION MAIL CONFIGURATION (GMAIL SMTP)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=nazreenabanu85@gmail.com
# Extracted safely into a variable so your Google account app-password stays secret
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================================
# EMBEDDED SERVER CONFIGURATION
# ============================================================
# Render injects its own dynamic host port inside the PORT variable at runtime
server.port=${PORT:8080}