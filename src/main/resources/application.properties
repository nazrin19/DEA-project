# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================
# Changed to "update" so your database tables don't get wiped out.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# DATA SEEDING CONFIGURATION (EVERYDAY / TEAM MODE)

# Changed to "never" so it stops trying to insert duplicate rows.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

spring.sql.init.resources=classpath:data.sql

spring.sql.init.continue-on-error=false


# THYMELEAF TEMPLATE ENGINE
spring.thymeleaf.cache=false

# FILE UPLOADS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.dir=uploads/

